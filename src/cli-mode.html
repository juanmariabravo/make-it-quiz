<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modo CLI - Make It Quiz</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/modes.css">
    <link rel="stylesheet" href="styles/cli-mode.css">
</head>

<body>
    <header class="header">
        <a href="index.html" class="logo">make-it-quiz</a>
        <nav class="nav">
            <a href="index.html">Inicio</a>
            <a href="../index.html#modes">Jugar</a>
            <button class="theme-toggle" onclick="toggleTheme()">☀️</button>
        </nav>
    </header>

    <div class="container" style="margin-top: 100px;">
        <!-- Category Selection -->
        <div id="category-select" class="category-selection">
            <div class="mode-header">
                <div class="mode-icon">💻</div>
                <h1>Modo CLI</h1>
                <p>Experiencia en línea de comandos para los más técnicos</p>
            </div>

            <div class="category-card">
                <label for="category">Elige una categoría:</label>
                <select id="category" class="category-dropdown"></select>
                <button id="load-category" class="btn btn-primary">Iniciar CLI</button>
            </div>
        </div>

        <!-- CLI Terminal -->
        <div id="cli-area" style="display:none;">
            <div class="terminal-window">
                <div class="terminal-header">
                    <div class="terminal-buttons">
                        <span class="terminal-btn close" onclick="confirmExit()"></span>
                        <span class="terminal-btn minimize"></span>
                        <span class="terminal-btn maximize"></span>
                    </div>
                    <div class="terminal-title">make-it-quiz-cli</div>
                </div>

                <div class="terminal-body" id="terminal-body">
                    <div id="terminal-output"></div>
                    <div class="terminal-input-line">
                        <span class="terminal-prompt">$</span>
                        <input type="text" id="terminal-input" class="terminal-input" autocomplete="off" autofocus>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../src/scripts/quiz-engine.js"></script>
    <script src="../src/scripts/app.js"></script>
    <script>
        const engine = new QuizEngine();
        let currentState = 'idle';
        let currentAnswer = null;
        let correctCount = 0;
        let incorrectCount = 0;

        // Load categories on page load
        window.onload = async () => {
            try {
                const categories = await engine.loadCategories();
                const select = document.getElementById('category');
                categories.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat;
                    opt.textContent = cat.replace(/\.(txt|json)$/, '');
                    select.appendChild(opt);
                });
            } catch (err) {
                alert('Error al cargar categorías: ' + err.message);
            }
        };

        // Load category and start CLI
        document.getElementById('load-category').onclick = async () => {
            const filename = document.getElementById('category').value;

            try {
                await engine.loadQuestions(filename);
                if (engine.questions.length === 0) {
                    throw new Error('No se encontraron preguntas en esta categoría.');
                }

                engine.init('cli', filename);
                document.getElementById('category-select').style.display = 'none';
                document.getElementById('cli-area').style.display = 'block';

                correctCount = 0;
                incorrectCount = 0;

                initCLI(filename);
            } catch (err) {
                alert('Error al cargar preguntas: ' + err.message);
            }
        };

        function initCLI(filename) {
            printLine('$ make-it-quiz --mode=cli --category="' + filename.replace(/\.(txt|json)$/, '') + '"', 'command');
            printLine('');
            printBox([
                'make-it-quiz CLI v1.0.0',
                'Modo terminal para los más técnicos'
            ]);
            printLine('');
            printLine('Cargando categoría: ' + filename.replace(/\.(txt|json)$/, '') + '...', 'info');
            printLine('Encontradas ' + engine.questions.length + ' preguntas.', 'success');
            printLine('Iniciando cuestionario...', 'info');
            printLine('');
            printLine('Comandos disponibles:', 'info');
            printLine('  - Responde con el número de la opción (1, 2, 3, etc.)', 'muted');
            printLine('  - "skip" o "s" para saltar la pregunta', 'muted');
            printLine('  - "exit" o "quit" para salir', 'muted');
            printLine('  - "help" para ver esta ayuda', 'muted');
            printLine('');

            currentState = 'question';
            showQuestion();
        }

        function showQuestion() {
            const q = engine.getCurrentQuestion();
            const isMulti = engine.isMultipleAnswer();

            printLine('━'.repeat(60), 'separator');
            printLine(`Pregunta ${engine.currentQuestionIndex + 1}/${engine.questions.length}`, 'question-number');
            printLine('');
            printLine(q.question, 'question');
            printLine('');

            if (isMulti) {
                printLine('⚠ Esta pregunta tiene múltiples respuestas correctas', 'warning');
                printLine('Responde con los números separados por comas (ej: 1,3)', 'warning');
                printLine('');
            }

            q.options.forEach((opt, i) => {
                printLine(`  ${i + 1}) ${opt}`, 'option');
            });

            printLine('');
            currentState = 'waiting_answer';
        }

        function printLine(text, className = '') {
            const output = document.getElementById('terminal-output');
            const line = document.createElement('div');
            line.className = 'terminal-line ' + className;
            line.textContent = text;
            output.appendChild(line);
            scrollToBottom();
        }

        function printBox(lines) {
            const output = document.getElementById('terminal-output');
            const width = Math.max(...lines.map(l => l.length)) + 4;

            printLine('┌' + '─'.repeat(width - 2) + '┐', 'box');
            lines.forEach(line => {
                const padding = width - line.length - 4;
                printLine('│ ' + line + ' '.repeat(padding) + ' │', 'box');
            });
            printLine('└' + '─'.repeat(width - 2) + '┘', 'box');
        }

        function scrollToBottom() {
            const body = document.getElementById('terminal-body');
            body.scrollTop = body.scrollHeight;
        }

        // Handle terminal input
        document.getElementById('terminal-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const input = e.target.value.trim();
                e.target.value = '';

                if (!input) return;

                printLine('$ ' + input, 'user-input');
                handleCommand(input);
            }
        });

        function handleCommand(input) {
            const cmd = input.toLowerCase();

            if (cmd === 'exit' || cmd === 'quit') {
                printLine('');
                printLine('Saliendo del cuestionario...', 'info');
                printLine('');
                showFinalResults();
                return;
            }

            if (cmd === 'help') {
                printLine('');
                printLine('Comandos disponibles:', 'info');
                printLine('  - Responde con el número de la opción (1, 2, 3, etc.)', 'muted');
                printLine('  - "skip" o "s" para saltar la pregunta', 'muted');
                printLine('  - "exit" o "quit" para salir', 'muted');
                printLine('  - "help" para ver esta ayuda', 'muted');
                printLine('');
                return;
            }

            if (cmd === 'skip' || cmd === 's') {
                printLine('Pregunta saltada.', 'warning');
                printLine('');
                nextQuestion();
                return;
            }

            if (currentState === 'waiting_answer') {
                handleAnswer(input);
            }
        }

        function handleAnswer(input) {
            const q = engine.getCurrentQuestion();
            const isMulti = engine.isMultipleAnswer();

            let userAnswer;

            if (isMulti) {
                // Parse multiple answers
                const parts = input.split(',').map(s => s.trim());
                userAnswer = parts.map(p => parseInt(p) - 1).filter(n => !isNaN(n) && n >= 0 && n < q.options.length);

                if (userAnswer.length === 0) {
                    printLine('Error: Respuesta inválida. Usa números separados por comas (ej: 1,3)', 'error');
                    printLine('');
                    return;
                }
            } else {
                // Parse single answer
                userAnswer = parseInt(input) - 1;

                if (isNaN(userAnswer) || userAnswer < 0 || userAnswer >= q.options.length) {
                    printLine('Error: Respuesta inválida. Usa un número entre 1 y ' + q.options.length, 'error');
                    printLine('');
                    return;
                }
            }

            const isCorrect = engine.submitAnswer(userAnswer);

            printLine('');
            if (isCorrect) {
                correctCount++;
                printLine('✓ ¡Correcto!', 'success');
            } else {
                incorrectCount++;
                printLine('✗ Incorrecto.', 'error');

                if (isMulti) {
                    const correctAnswers = q.answer.map(i => (i + 1) + ') ' + q.options[i]).join(', ');
                    printLine('Las respuestas correctas son: ' + correctAnswers, 'info');
                } else {
                    printLine('La respuesta correcta es: ' + (q.answer + 1) + ') ' + q.options[q.answer], 'info');
                }
            }

            printLine('');
            printLine(`Estadísticas: ${correctCount} correctas, ${incorrectCount} incorrectas`, 'muted');
            printLine('');

            nextQuestion();
        }

        function nextQuestion() {
            if (engine.nextQuestion()) {
                showQuestion();
            } else {
                showFinalResults();
            }
        }

        function showFinalResults() {
            currentState = 'finished';

            printLine('━'.repeat(60), 'separator');
            printLine('');
            printBox([
                '¡CUESTIONARIO COMPLETADO!',
                '',
                `Preguntas totales: ${engine.questions.length}`,
                `Correctas: ${correctCount}`,
                `Incorrectas: ${incorrectCount}`,
                `Porcentaje: ${Math.round((correctCount / engine.questions.length) * 100)}%`
            ]);
            printLine('');

            const percentage = (correctCount / engine.questions.length) * 100;
            if (percentage === 100) {
                printLine('🎉 ¡Perfecto! ¡Has acertado todas las preguntas!', 'success');
            } else if (percentage >= 80) {
                printLine('🌟 ¡Excelente trabajo!', 'success');
            } else if (percentage >= 60) {
                printLine('👍 ¡Buen trabajo!', 'success');
            } else {
                printLine('📚 Sigue practicando.', 'info');
            }

            printLine('');
            printLine('Escribe "exit" para salir o recarga la página para volver a jugar.', 'muted');
            printLine('');

            // Disable input
            document.getElementById('terminal-input').disabled = true;
        }

        function confirmExit() {
            if (currentState === 'finished' || confirm('¿Estás seguro de que quieres salir? Perderás el progreso.')) {
                window.location.href = 'index.html#modes';
            }
        }

        // Focus input when clicking on terminal
        document.getElementById('terminal-body').addEventListener('click', () => {
            document.getElementById('terminal-input').focus();
        });
    </script>
</body>

</html>
